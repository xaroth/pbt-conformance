name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: go fix makes no changes
        run: go fix ./... && git diff --exit-code
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pull the pinned datasets
        id: data
        run: echo "dir=$(go run ./cmd/pbtc data --cache "$RUNNER_TEMP/pbtc")" >> "$GITHUB_OUTPUT"
      - name: Tests with real datasets
        run: go test ./...
        env:
          PBT_DATASETS: ${{ steps.data.outputs.dir }}
      - name: Compare with the stored PoB values
        run: go run ./cmd/pbtc compare --datasets "$DATASETS"
        env:
          DATASETS: ${{ steps.data.outputs.dir }}
